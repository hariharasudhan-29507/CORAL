services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data

  coturn:
    image: coturn/coturn:4.6
    network_mode: host
    command:
      - "--listening-port=3478"
      - "--fingerprint"
      - "--use-auth-secret"
      - "--static-auth-secret=${TURN_SECRET:?set TURN_SECRET}"
      - "--no-cli"
      - "--no-tls"
      - "--no-dtls"
      - "--realm=${TURN_REALM:?set TURN_REALM}"

volumes:
  redis-data:
